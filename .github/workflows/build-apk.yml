name: Build FrazFit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FrazFit source
        run: |
          unzip -q FrazFit_v1.0_source.zip
          ls -la FrazFit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: FrazFit
        run: npm install

      - name: Generate Android project
        working-directory: FrazFit
        run: npx expo prebuild --platform android --non-interactive

      - name: Make Gradle executable
        working-directory: FrazFit
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: FrazFit/android
        run: ./gradlew assembleDebug

      - name: Prepare final APK
        run: |
          cp FrazFit/android/app/build/outputs/apk/debug/app-debug.apk FrazFit-v1.0.apk

      - name: Upload FrazFit APK
        uses: actions/upload-artifact@v4
        with:
          name: FrazFit-v1.0-APK
          path: FrazFit-v1.0.apk
          if-no-files-found: error
