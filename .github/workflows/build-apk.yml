name: Build FrazFit Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FrazFit source
        run: |
          unzip -q FrazFit_v1.0_source.zip
          echo "FrazFit source extracted"
          ls -la FrazFit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FrazFit/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: FrazFit
        run: npm install

      - name: Generate Android project
        working-directory: FrazFit
        run: npx expo prebuild --platform android --non-interactive

      - name: Make Gradle executable
        working-directory: FrazFit
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: FrazFit/android
        run: ./gradlew assembleRelease

      - name: Find and prepare APK
        run: |
          echo "Searching for release APK..."

          APK_PATH=$(find FrazFit/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found"
            exit 1
          fi

          echo "APK found at: $APK_PATH"

          cp "$APK_PATH" FrazFit-v1.0-Release.apk

          ls -lh FrazFit-v1.0-Release.apk

      - name: Upload FrazFit Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FrazFit-v1.0-Release-APK
          path: FrazFit-v1.0-Release.apk
          if-no-files-found: error
          retention-days: 30
