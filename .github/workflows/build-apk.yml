name: Build FrazFit Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FrazFit source
        run: |
          rm -rf FrazFit
          unzip -q FrazFit_v1.0_source.zip
          echo "Source extracted successfully"
          ls -la FrazFit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: FrazFit
        run: npm install

      - name: Generate Android project
        working-directory: FrazFit
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Make Gradle executable
        working-directory: FrazFit
        run: chmod +x android/gradlew

      - name: Build standalone Release APK
        working-directory: FrazFit/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate Release APK
        run: |
          echo "Searching for APK..."
          find FrazFit/android/app/build/outputs/apk -type f -name "*.apk" -print

          APK_PATH=$(find FrazFit/android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          cp "$APK_PATH" FrazFit-v1.0-Release.apk
          echo "Final APK created:"
          ls -lh FrazFit-v1.0-Release.apk

      - name: Upload FrazFit Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FrazFit-v1.0-Release-APK
          path: FrazFit-v1.0-Release.apk
          if-no-files-found: error
          retention-days: 30
